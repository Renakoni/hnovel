name: Android checks 2/4 - Devices

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-device-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  execution-platform:
    name: Isolated execution (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
        include:
          - api: 35
            native_tests: ",indi.renakoni.nextvol.sourceexecution.NativeBrowserInstrumentedTest,indi.renakoni.nextvol.sourceexecution.NativeBrowserStorageInstrumentedTest,indi.renakoni.nextvol.sourceexecution.NativeBrowserRouteInstrumentedTest,indi.renakoni.nextvol.sourceexecution.NativeBrowserEnvironmentInstrumentedTest,indi.renakoni.nextvol.sourceexecution.BrowserEnvironmentInstrumentedTest,indi.renakoni.nextvol.sourceexecution.SourceVerificationInstrumentedTest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      # setup-gradle also caches wrapper distributions; keep a single cache owner.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Describe isolated execution boundary
        run: |
          echo "Running Android isolatedProcess instrumentation on API ${{ matrix.api }}"
          echo "Tests exercise remote Binder, isolated UID, lifecycle termination and wire limits"
      - name: Build test APKs before starting the emulator
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain --stacktrace --max-workers=2
          ./gradlew --stop
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            status=0;
            bash .github/scripts/emulator-tests.sh bash .github/scripts/connected-tests.sh ',indi.renakoni.nextvol.EpubShareInstrumentedTest,indi.renakoni.nextvol.reader.ReaderSpacingInstrumentedTest,indi.renakoni.nextvol.reader.ReaderLayoutInstrumentedTest,indi.renakoni.nextvol.data.download.DownloadPersistenceInstrumentedTest,indi.renakoni.nextvol.data.localbook.LocalBookImportInstrumentedTest,indi.renakoni.nextvol.defaultplugin.wenku8.Wenku8NetworkInstrumentedTest,indi.renakoni.nextvol.tts.SystemSpeechInstrumentedTest,indi.renakoni.nextvol.tts.ReadAloudBackgroundInstrumentedTest,indi.renakoni.nextvol.tts.HttpSpeechInstrumentedTest${{ matrix.native_tests }}' || status=$?;
            if [ '${{ matrix.api }}' = '35' ]; then
            mkdir -p app/build/outputs/androidTest-results/connected;
            adb pull /sdcard/Android/data/indi.renakoni.nextvol.debug/files/native-environment.json app/build/outputs/androidTest-results/connected/native-environment.json || status=1;
            fi;
            exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-platform-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
            app/build/reports/emulator-diagnostics
          if-no-files-found: ignore
