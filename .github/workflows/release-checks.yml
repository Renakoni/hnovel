name: Android checks 3/4 - Release

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-apk:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      # setup-gradle also caches wrapper distributions; keep a single cache owner.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --console=plain --stacktrace --max-workers=2
      - name: Upload release build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-reports
          path: |
            app/build/outputs/mapping/release/missing_rules.txt
            app/build/outputs/mapping/release/usage.txt
          if-no-files-found: ignore

  minified-source-runtime:
    name: Minified source runtime (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      # setup-gradle also caches wrapper distributions; keep a single cache owner.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build minified app and test APKs before starting the emulator
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleBenchmark :benchmark:assembleBenchmark --console=plain --stacktrace --max-workers=2
          ./gradlew --stop
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/emulator-tests.sh ./gradlew :benchmark:connectedBenchmarkAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=indi.renakoni.nextvol.benchmark.explore.MinifiedSourceRuntimeTest,indi.renakoni.nextvol.benchmark.tts.ReadAloudSmokeTest --console=plain --stacktrace --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minified-source-runtime
          path: |
            tests/benchmark/build/reports/androidTests/connected
            tests/benchmark/build/outputs/androidTest-results/connected
            app/build/outputs/mapping/benchmark/usage.txt
            app/build/outputs/mapping/benchmark/missing_rules.txt
            app/build/reports/emulator-diagnostics
          if-no-files-found: ignore
