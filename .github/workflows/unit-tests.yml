name: Android PR checks

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run JVM unit tests and build release APK
        run: ./gradlew :app:testDebugUnitTest :source-rules:test :source-network:test :source-import:test :source-execution:test :source-compatibility:test :source-rhino:test :source-content:test :app:assembleRelease --console=plain --stacktrace --max-workers=2
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            app/build/outputs/mapping/release/missing_rules.txt
            app/build/outputs/mapping/release/usage.txt
            source-rules/build/reports/tests/test
            source-rules/build/test-results/test
            source-network/build/reports/tests/test
            source-network/build/test-results/test
            source-execution/build/reports/tests/test
            source-execution/build/test-results/test
            source-import/build/reports/tests/test
            source-import/build/test-results/test
            source-compatibility/build/reports/tests/test
            source-compatibility/build/test-results/test
            source-compatibility/build/reports/source-compatibility
            source-rhino/build/reports/tests/test
            source-content/build/test-results/test
            source-content/build/reports/tests/test
            source-rhino/build/test-results/test
          if-no-files-found: ignore

  minified-source-runtime:
    name: Minified source runtime (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build minified app and test APKs before starting the emulator
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleBenchmark :benchmark:assembleBenchmark --console=plain --stacktrace --max-workers=2
          ./gradlew --stop
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :benchmark:connectedBenchmarkAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=indi.renakoni.nextvol.benchmark.explore.MinifiedSourceRuntimeTest --console=plain --stacktrace --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minified-source-runtime
          path: |
            benchmark/build/reports/androidTests/connected
            benchmark/build/outputs/androidTest-results/connected
            app/build/outputs/mapping/benchmark/usage.txt
            app/build/outputs/mapping/benchmark/missing_rules.txt
          if-no-files-found: ignore

  execution-platform:
    name: Isolated execution (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
        include:
          - api: 35
            native_tests: ",indi.renakoni.nextvol.sourceexecution.NativeBrowserInstrumentedTest,indi.renakoni.nextvol.sourceexecution.NativeBrowserStorageInstrumentedTest,indi.renakoni.nextvol.sourceexecution.NativeBrowserRouteInstrumentedTest,indi.renakoni.nextvol.sourceexecution.NativeBrowserEnvironmentInstrumentedTest,indi.renakoni.nextvol.sourceexecution.BrowserEnvironmentInstrumentedTest,indi.renakoni.nextvol.sourceexecution.SourceVerificationInstrumentedTest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Describe isolated execution boundary
        run: |
          echo "Running Android isolatedProcess instrumentation on API ${{ matrix.api }}"
          echo "Tests exercise remote Binder, isolated UID, lifecycle termination and wire limits"
      - name: Build test APKs before starting the emulator
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain --stacktrace --max-workers=2
          ./gradlew --stop
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            status=0;
            bash .github/scripts/connected-tests.sh ',indi.renakoni.nextvol.reader.ReaderSpacingInstrumentedTest,indi.renakoni.nextvol.reader.ReaderLayoutInstrumentedTest,indi.renakoni.nextvol.data.download.DownloadPersistenceInstrumentedTest,indi.renakoni.nextvol.data.localbook.LocalBookImportInstrumentedTest,indi.renakoni.nextvol.defaultplugin.wenku8.Wenku8NetworkInstrumentedTest${{ matrix.native_tests }}' || status=$?;
            if [ '${{ matrix.api }}' = '35' ]; then
            mkdir -p app/build/outputs/androidTest-results/connected;
            adb pull /sdcard/Android/data/indi.renakoni.nextvol.debug/files/native-environment.json app/build/outputs/androidTest-results/connected/native-environment.json || status=1;
            fi;
            exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-platform-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
            app/build/reports/emulator-diagnostics
          if-no-files-found: ignore
