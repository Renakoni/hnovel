name: Android checks 1/3 - JVM

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-jvm-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      # setup-gradle also caches wrapper distributions; keep a single cache owner.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Check emulator preparation and failure handling
        run: python3 .github/scripts/test_emulator_tests.py
      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest :epub:test :source-rules:test :source-network:test :source-import:test :source-execution:test :source-compatibility:test :source-rhino:test :source-content:test :source-speech:test --console=plain --stacktrace --max-workers=2
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            epub/build/reports/tests/test
            epub/build/test-results/test
            sources/rules/build/reports/tests/test
            sources/rules/build/test-results/test
            sources/network/build/reports/tests/test
            sources/network/build/test-results/test
            sources/execution/build/reports/tests/test
            sources/execution/build/test-results/test
            sources/import/build/reports/tests/test
            sources/import/build/test-results/test
            tests/source-compatibility/build/reports/tests/test
            tests/source-compatibility/build/test-results/test
            tests/source-compatibility/build/reports/source-compatibility
            sources/rhino/build/reports/tests/test
            sources/content/build/test-results/test
            sources/content/build/reports/tests/test
            sources/rhino/build/test-results/test
            sources/speech/build/test-results/test
            sources/speech/build/reports/tests/test
          if-no-files-found: ignore
