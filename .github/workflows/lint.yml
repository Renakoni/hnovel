name: Android checks 4/4 - Lint

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-lint-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # One cache owner, with no writes from PR or merge-group code.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Check resource contracts
        shell: bash
        run: |
          mkdir -p build/reports/lint
          python3 .github/scripts/test_check_resources.py 2>&1 | tee build/reports/lint/resource-tests.log
          python3 .github/scripts/check_resources.py 2>&1 | tee build/reports/lint/resources.log
      - name: Run full app Debug Lint
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p build/reports/lint
          chmod +x ./gradlew
          ./gradlew :app:lintDebug --console=plain --stacktrace --max-workers=2 2>&1 | tee build/reports/lint/gradle.log
      - name: Upload Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug
            build/reports/lint
          if-no-files-found: warn
