name: Warm Gradle cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradle-cache-main
  cancel-in-progress: false

jobs:
  warm:
    if: github.ref == 'refs/heads/main'
    name: Populate main Gradle caches
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      # setup-gradle also caches wrapper distributions; keep a single cache owner.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Warm dependency and compilation caches
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:compileDebugUnitTestKotlin --console=plain --stacktrace --max-workers=2
